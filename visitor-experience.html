<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise For You 💌</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            overflow: hidden;
            height: 100vh;
            background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
            transition: background 0.5s ease;
        }
        .scene-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }
        .scene-content {
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1, h2 { 
            color: white; 
            margin-bottom: 20px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-family: 'Dancing Script', cursive;
        }
        p { 
            color: rgba(255, 255, 255, 0.9); 
            margin-bottom: 30px; 
            line-height: 1.6;
        }
        .btn-premium {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #ff6b6b, #ffa5a5);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            margin: 10px;
        }
        .btn-premium:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.6);
        }
        .gift-box { font-size: 80px; cursor: pointer; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .cake-container { position: relative; font-size: 80px; }
        .candle { 
            position: absolute; 
            bottom: 20px; 
            font-size: 30px;
            animation: flicker 0.5s infinite;
        }
        @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .confetti { position: absolute; font-size: 20px; animation: fall 3s linear; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
        .card-item { 
            background: rgba(255, 255, 255, 0.3); 
            padding: 20px; 
            border-radius: 15px; 
            margin: 20px 0;
        }
        .photo-item { 
            background: white; 
            padding: 15px; 
            border-radius: 10px; 
            margin: 15px 0;
            transform: rotate(-2deg);
        }
        .envelope { font-size: 100px; cursor: pointer; }
        .letter-content { 
            background: rgba(255, 255, 255, 0.9); 
            padding: 30px; 
            border-radius: 10px;
            color: #333;
            text-align: left;
            max-height: 400px;
            overflow-y: auto;
        }
        .hidden { display: none !important; }
        .yes-btn { background: linear-gradient(45deg, #4ade80, #86efac); }
        .no-btn { background: linear-gradient(45deg, #f87171, #fca5a5); position: relative; }
        
        /* Theme Overrides */
        body.theme-sorry { background: linear-gradient(135deg, #e0c3fc, #8ec5fc); }
        body.theme-love { background: linear-gradient(135deg, #ff9a9e, #fecfef); }
        body.theme-proposal { background: linear-gradient(135deg, #fad0c4, #ffd1ff); }
        body.theme-eid { background: radial-gradient(circle, #1a1a2e, #16213e); }
        body.theme-eid h1, body.theme-eid h2, body.theme-eid p { color: #f0f0f0; }
        body.theme-ramadan { background: linear-gradient(135deg, #2c3e50, #3498db); }
        body.theme-christmas { background: linear-gradient(135deg, #c0392b, #27ae60); }
    </style>
</head>
<body>
    <div id="scene-container" class="scene-container"></div>
    <audio id="bgMusic" loop></audio>

    <script src="script.js"></script>
    <script>
        // Visitor Experience Engine
        let currentSceneIndex = 0;
        let experienceData = null;
        let scenes = [];
        
        // Category configurations
        const categoryConfig = {
            birthday: {
                theme: 'birthday',
                floatingIcons: ['🎂', '🎈', '🎁', '🎉', '❤️'],
                music: '', // Add music URL later
                finalMessage: 'Enjoy Your Day, Cutieee! 🎂💖'
            },
            sorry: {
                theme: 'sorry',
                floatingIcons: ['🥺', '💔', '🌹', '❤️‍🩹'],
                music: '',
                finalMessage: 'I hope you can forgive me, My Sweet Heart ❤️‍🩹'
            },
            love: {
                theme: 'love',
                floatingIcons: ['❤️', '💕', '🌹', '✨'],
                music: '',
                finalMessage: 'Forever Yours, My Love ❤️'
            },
            proposal: {
                theme: 'proposal',
                floatingIcons: ['💍', '❤️', '🌹', '✨'],
                music: '',
                finalMessage: 'Will You Make Me The Happiest? 💍'
            },
            anniversary: {
                theme: 'anniversary',
                floatingIcons: ['💕', '🌹', '📸', '✨'],
                music: '',
                finalMessage: 'Here\'s To Many More Years! 💕'
            },
            friendship: {
                theme: 'friendship',
                floatingIcons: ['👫', '😂', '💕', '✨'],
                music: '',
                finalMessage: 'Best Friends Forever! 🤝'
            },
            eid: {
                theme: 'eid',
                floatingIcons: ['🌙', '⭐', '🏮', '🎁'],
                music: '',
                finalMessage: 'Eid Mubarak! 🌙✨'
            },
            ramadan: {
                theme: 'ramadan',
                floatingIcons: ['🌙', '⭐', '🏮'],
                music: '',
                finalMessage: 'Ramadan Mubarak! 🌙'
            },
            christmas: {
                theme: 'christmas',
                floatingIcons: ['🎄', '❄️', '🎁', '⭐'],
                music: '',
                finalMessage: 'Merry Christmas! 🎄✨'
            }
        };
        
        function loadExperience() {
            const urlParams = new URLSearchParams(window.location.search);
            const shareId = urlParams.get('share');
            
            if (!shareId) {
                document.getElementById('scene-container').innerHTML = `
                    <div class="scene-content">
                        <h2 style="color:white;">Oops! 🥺</h2>
                        <p style="color:white;">This link seems broken or incomplete.</p>
                        <button class="btn-premium" onclick="window.location.href='home.html'">Go Home 🏠</button>
                    </div>`;
                return null;
            }
            
            try {
                const letters = JSON.parse(localStorage.getItem('memoryLetters')) || [];
                experienceData = letters.find(l => l.shareId === shareId);
                
                if (!experienceData) {
                    document.getElementById('scene-container').innerHTML = `
                        <div class="scene-content">
                            <h2 style="color:white;">Experience not found 😔</h2>
                            <p style="color:white;">This link may be invalid or expired.</p>
                            <button class="btn-premium" onclick="window.location.href='home.html'">Go Home 🏠</button>
                        </div>`;
                    return null;
                }
                
                // Apply theme
                const config = categoryConfig[experienceData.category] || categoryConfig.birthday;
                document.body.className = `theme-${config.theme}`;
                
                // Setup floating icons
                setupFloatingIcons(config.floatingIcons);
                
                return experienceData;
            } catch (e) {
                console.error('Error loading experience:', e);
                return null;
            }
        }
        
        function setupFloatingIcons(icons) {
            const container = document.createElement('div');
            container.id = 'floating-icons';
            container.style.position = 'fixed';
            container.style.top = '0';
            container.style.left = '0';
            container.style.width = '100%';
            container.style.height = '100%';
            container.style.pointerEvents = 'none';
            container.style.zIndex = '-1';
            container.style.overflow = 'hidden';
            
            for (let i = 0; i < 20; i++) {
                const icon = document.createElement('div');
                icon.textContent = icons[Math.floor(Math.random() * icons.length)];
                icon.style.position = 'absolute';
                icon.style.left = Math.random() * 100 + 'vw';
                icon.style.top = Math.random() * 100 + 'vh';
                icon.style.fontSize = (Math.random() * 20 + 10) + 'px';
                icon.style.opacity = Math.random() * 0.5 + 0.3;
                icon.style.animation = `float ${Math.random() * 10 + 10}s linear infinite`;
                container.appendChild(icon);
            }
            
            document.body.appendChild(container);
            
            const style = document.createElement('style');
            style.textContent = `
                @keyframes float {
                    0% { transform: translateY(0) rotate(0deg); }
                    100% { transform: translateY(-100vh) rotate(360deg); }
                }
            `;
            document.head.appendChild(style);
        }
        
        function buildScenes() {
            const cat = experienceData.category;
            scenes = [];
            
            // Opening scene
            scenes.push({
                type: 'opening',
                text: `Something special is waiting for you... ✨<br><br>Ready, ${experienceData.recipientName || 'Cutie'}? 💕`
            });
            
            // Category-specific scenes
            if (cat === 'birthday') {
                scenes.push({ type: 'surprise', text: 'Next surprise is waiting for you, Cutie 🎀' });
                scenes.push({ type: 'gift', text: 'Click the gift to see your surprise 🎁' });
                scenes.push({ type: 'yesno', question: 'Ready for your surprise?' });
                scenes.push({ type: 'cake', text: 'Make a Wish 🎂✨' });
                scenes.push({ type: 'celebration', text: 'Happy Birthday! 🎉' });
            } else if (cat === 'sorry') {
                scenes.push({ type: 'apology-intro', text: 'I\'m Sorry, Cutie 🥺<br><br>I made something for you...' });
                scenes.push({ type: 'gift', text: 'A little apology surprise... 💔' });
                scenes.push({ type: 'yesno', question: 'Will you forgive me?' });
                scenes.push({ type: 'broken-heart', text: 'Sorry, My Sweet Heart ❤️‍🩹' });
            } else if (cat === 'proposal') {
                scenes.push({ type: 'romantic-intro', text: 'A question that will change everything... 💍' });
                scenes.push({ type: 'ring-box', text: 'Will you marry me? 💍' });
                scenes.push({ type: 'yesno', question: 'Say Yes to Forever?' });
            } else if (cat === 'love') {
                scenes.push({ type: 'heart-intro', text: 'A little surprise from my heart to yours... ❤️' });
                scenes.push({ type: 'gift', text: 'Open this with love 🎁' });
                scenes.push({ type: 'yesno', question: 'Do you accept my love?' });
            } else {
                // Default flow for other categories
                scenes.push({ type: 'intro', text: 'A special surprise for you... ✨' });
                scenes.push({ type: 'gift', text: 'Click to open 🎁' });
                scenes.push({ type: 'yesno', question: 'Ready?' });
            }
            
            // Cards
            const cards = experienceData.cards || [];
            cards.forEach((card, index) => {
                scenes.push({
                    type: 'card',
                    cardIndex: index,
                    data: card
                });
            });
            
            // Photos
            const photos = experienceData.photos || [];
            if (photos.length > 0) {
                scenes.push({ type: 'photos', data: photos });
            }
            
            // Envelope & Letter
            scenes.push({ type: 'envelope', text: 'One last thing... 💌' });
            scenes.push({ 
                type: 'letter', 
                title: experienceData.title || 'A Letter For You',
                content: experienceData.message || '',
                sender: experienceData.senderName || 'Someone Special'
            });
            
            // Final
            const config = categoryConfig[cat] || categoryConfig.birthday;
            scenes.push({
                type: 'final',
                text: experienceData.finalMessage || config.finalMessage
            });
        }
        
        function renderScene() {
            const container = document.getElementById('scene-container');
            const sceneData = scenes[currentSceneIndex];
            let html = '<div class="scene-content">';
            
            switch(sceneData.type) {
                case 'opening':
                    html += `<h1>${sceneData.text}</h1>`;
                    html += `<button class="btn-premium" onclick="nextScene()">Next ✨</button>`;
                    break;
                    
                case 'surprise':
                case 'apology-intro':
                case 'romantic-intro':
                case 'heart-intro':
                case 'intro':
                    html += `<h2>${sceneData.text}</h2>`;
                    html += `<button class="btn-premium" onclick="nextScene()">Next 💕</button>`;
                    break;
                    
                case 'gift':
                    html += `<h2>${sceneData.text}</h2>`;
                    html += `<div class="gift-box" onclick="openGift()">🎁</div>`;
                    break;
                    
                case 'yesno':
                    html += `<h2>${sceneData.question}</h2>`;
                    html += `<div style="margin-top:30px;">`;
                    html += `<button class="btn-premium yes-btn" onclick="handleYes()">YES 💖</button>`;
                    html += `<button class="btn-premium no-btn" id="noBtn" onmouseover="moveNoBtn()" onclick="handleNo()">NO 🙈</button>`;
                    html += `</div>`;
                    break;
                    
                case 'cake':
                    html += `<h2>${sceneData.text}</h2>`;
                    html += `<div class="cake-container">`;
                    html += `🎂`;
                    html += `<span class="candle" style="left:20%">🕯️</span>`;
                    html += `<span class="candle" style="left:50%">🕯️</span>`;
                    html += `<span class="candle" style="left:80%">🕯️</span>`;
                    html += `</div>`;
                    html += `<button class="btn-premium" onclick="blowCandles()">Blow Candles 🕯️</button>`;
                    break;
                    
                case 'celebration':
                    createConfetti();
                    html += `<h2>${sceneData.text}</h2>`;
                    html += `<button class="btn-premium" onclick="nextScene()">Continue 💌</button>`;
                    break;
                    
                case 'broken-heart':
                    html += `<h2>${sceneData.text}</h2>`;
                    html += `<div style="font-size:80px;">💔</div>`;
                    html += `<button class="btn-premium" onclick="nextScene()">Continue 💌</button>`;
                    break;
                    
                case 'ring-box':
                    html += `<h2>${sceneData.text}</h2>`;
                    html += `<div style="font-size:80px;cursor:pointer;" onclick="openRing()">💍</div>`;
                    break;
                    
                case 'card':
                    const card = sceneData.data;
                    html += `<div class="card-item">`;
                    html += `<h3>${card.title || 'A Special Card'}</h3>`;
                    html += `<p>${card.message || card.content || 'Sending you lots of love!'}</p>`;
                    html += `</div>`;
                    html += `<button class="btn-premium" onclick="nextScene()">Next ✨</button>`;
                    break;
                    
                case 'photos':
                    html += `<h2>Beautiful Memories 📸</h2>`;
                    html += `<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">`;
                    sceneData.data.forEach(p => {
                        html += `<img src="${p.url}" style="width:150px;height:150px;object-fit:cover;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,0.2);">`;
                    });
                    html += `</div>`;
                    html += `<button class="btn-premium" onclick="nextScene()">Next 💌</button>`;
                    break;
                    
                case 'envelope':
                    html += `<h2>${sceneData.text}</h2>`;
                    html += `<div class="envelope" onclick="nextScene()">💌</div>`;
                    break;
                    
                case 'letter':
                    html += `<h2>${sceneData.title}</h2>`;
                    html += `<div class="letter-content" id="typewriter-text"></div>`;
                    html += `<p style="text-align:right;margin-top:20px;"><em>- ${sceneData.sender}</em></p>`;
                    html += `<button class="btn-premium" onclick="nextScene()">Continue ✨</button>`;
                    setTimeout(startTypewriter, 500);
                    break;
                    
                case 'final':
                    html += `<h1>${sceneData.text}</h1>`;
                    html += `<div style="margin-top:30px;">`;
                    html += `<button class="btn-premium" onclick="window.location.href='home.html'">💌 Create Your Own</button>`;
                    html += `<button class="btn-premium" onclick="shareExperience()">🔗 Share</button>`;
                    html += `</div>`;
                    break;
            }
            
            html += '</div>';
            container.innerHTML = html;
        }
        
        function nextScene() {
            if (currentSceneIndex < scenes.length - 1) {
                currentSceneIndex++;
                renderScene();
            }
        }
        
        function openGift() {
            createConfetti();
            alert('Surprise was waiting for you! 💝');
            nextScene();
        }
        
        function handleYes() {
            createConfetti();
            nextScene();
        }
        
        function handleNo() {
            const msgs = ["Please say YES 🥺", "Are you sure? 😭", "One tiny YES please 💕", "Try again, Cutie 🥹"];
            alert(msgs[Math.floor(Math.random() * msgs.length)]);
        }
        
        function moveNoBtn() {
            const btn = document.getElementById('noBtn');
            if (btn) {
                const x = Math.random() * 200 - 100;
                const y = Math.random() * 200 - 100;
                btn.style.transform = `translate(${x}px, ${y}px)`;
            }
        }
        
        function blowCandles() {
            document.querySelectorAll('.candle').forEach(c => c.style.opacity = '0.3');
            createConfetti();
            setTimeout(() => {
                alert('Yay! Candles blown! 🎉');
                nextScene();
            }, 1000);
        }
        
        function openRing() {
            createConfetti();
            alert('She said YES! 💍❤️');
            nextScene();
        }
        
        function startTypewriter() {
            const text = experienceData.message || 'Special message for you!';
            const element = document.getElementById('typewriter-text');
            if (!element) return;
            
            let i = 0;
            element.innerHTML = '';
            const typeInterval = setInterval(() => {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typeInterval);
                }
            }, 50);
        }
        
        function createConfetti() {
            const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#ff9ff3'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.innerText = '🎉';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.color = colors[Math.floor(Math.random() * colors.length)];
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 3000);
            }
        }
        
        function shareExperience() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert('Link copied! Share the surprise! 🔗');
            });
        }
        
        // Initialize
        window.onload = function() {
            if (loadExperience()) {
                buildScenes();
                renderScene();
            }
        };
    </script>
</body>
</html>
